name: "dbt_artifacts"
version: "2.9.3"
config-version: 2
require-dbt-version: [">=1.3.0", "<1.11.0"]
profile: "dbt_artifacts"

clean-targets: # folders to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dbt_artifacts:
    +materialized: view
    +file_format: '{{ "delta" if target.name == "databricks" else "" }}'
    sources:
      +materialized: incremental
      +on_schema_change: append_new_columns
      +full_refresh: false
      +persist_docs:
        # Databricks and SQL Server don't offer column-level support for persisting docs
        columns: '{{ target.name not in ["databricks", "dremio"] and target.type != "sqlserver" }}'
        relation: '{{ target.type != "sqlserver" and target.name not in ["dremio"] }}'
      +as_columnstore: False
